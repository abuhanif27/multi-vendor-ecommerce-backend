openapi: 3.0.3
info:
  title: Multi-Vendor Marketplace API
  version: 1.0.0
  description: |2

    A production-ready REST API for a multi-vendor e-commerce platform.

    ## Features

    - JWT Authentication
    - Vendor & Customer Roles
    - Shop Management
    - Product Catalog
    - Category Management
    - Product Filtering
    - Product Search
    - Product Ordering
    - Pagination

    Built with:

    - Django
    - Django REST Framework
    - PostgreSQL
  contact:
    name: Abu Hanif
    email: ahanif2500@gmail.com
  license:
    name: MIT
