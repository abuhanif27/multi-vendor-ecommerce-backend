  /api/v1/vendor-orders/:
    get:
      operationId: v1_vendor_orders_list
      description: List all vendor orders (sub-orders) for the authenticated vendor's
        shops.
      summary: List Vendor Orders
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Orders (Vendor)
      security:
      - jwtAuth: []
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVendorOrderList'
          description: ''
  /api/v1/vendor-orders/{id}/:
    get:
      operationId: v1_vendor_orders_retrieve
      description: Retrieve a specific vendor order.
      summary: Retrieve Vendor Order
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Orders (Vendor)
      security:
      - jwtAuth: []
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorOrder'
          description: ''
