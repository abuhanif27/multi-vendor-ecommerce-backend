  /api/v1/admin/promotions/:
    get:
      operationId: v1_admin_promotions_list
      description: Admin and Vendor APIs to manage promotions.
      parameters:
      - in: query
        name: is_exclusive
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - DRAFT
          - EXPIRED
          - PAUSED
        description: |-
          * `DRAFT` - Draft
          * `ACTIVE` - Active
          * `PAUSED` - Paused
          * `EXPIRED` - Expired
          * `ARCHIVED` - Archived
      tags:
      - v1
      security:
      - jwtAuth: []
      - jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPromotionList'
          description: ''
    post:
      operationId: v1_admin_promotions_create
